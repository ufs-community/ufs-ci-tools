[project]
name = "ufs-verify-submodules"
version = "0.1.0"
description = "Verify recursive Git submodule pointers against commits, tags, or branch heads."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "pyyaml>=6.0.2,<7"]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "types-pyyaml>=6,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["verify_submodules.py", "tests"]
